name: Docker Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🛠 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚫 Skip DockerHub login
        run: echo "✔️ Пропущено (не используется приватный реестр)"

      - name: 🧱 Build and export Docker image to tar
        run: |
          docker build -t panamaster:latest -f docker/Dockerfile .
          docker save panamaster:latest -o panamaster.tar

      - name: 🔐 Copy Docker image to server via rsync
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 90.156.135.41 >> ~/.ssh/known_hosts
          rsync -az -e "ssh -i ~/.ssh/id_ed25519" panamaster.tar root@90.156.135.41:/root/

      - name: 🚀 Load and run Docker image on server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          ssh -i ~/.ssh/id_ed25519 root@90.156.135.41 <<'EOF'
            docker load < /root/panamaster.tar
            docker stop panamaster || true
            docker rm panamaster || true
            docker run -d \
              --name panamaster \
              -p 8080:5000 \
              -v /var/www/panamaster/uploads:/app/uploads \
              panamaster:latest
          EOF
